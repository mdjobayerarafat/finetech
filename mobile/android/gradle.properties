org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Skip loading projects we don't need for the current task
org.gradle.configureondemand=false
# Faster file system watching on Linux/macOS
org.gradle.vfs.watch=true
org.gradle.filewatch.restart.on.filechanges=false
# Network: more parallel connections = faster dependency downloads
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.network.retry.max.attempts=10
# Allow up to 8 concurrent network threads for downloads
systemProp.org.gradle.internal.http.threads=8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
