[package]
name = "bankpilot"
version = "0.1.0"
edition = "2021"
description = "BankPilot backend (Rust + Actix Web) — simulation only."

[[bin]]
name = "bankpilot"
path = "src/main.rs"

[[bin]]
name = "bankpilot-seed"
path = "src/bin/seed.rs"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
tokio = { version = "1.40", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
urlencoding = "2.1"
rand = "0.8"
regex = "1.10"
once_cell = "1.20"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rust_decimal_macros = "1.36"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
http = "1.1"
url = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
